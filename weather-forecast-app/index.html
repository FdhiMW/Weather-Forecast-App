<!DOCTYPE html>
<html>
<head>
    <title>Weather Forecast</title>
    <style>
        body{
            font-family: Arial;
            background: linear-gradient(135deg,#4facfe,#00f2fe);
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .container{
            background:white;
            padding:30px;
            border-radius:20px;
            width:800px;
            text-align:center;
        }

        .forecast{
            display:flex;
            justify-content:space-around;
            margin-top:20px;
        }

        .card{
            background:#f5f5f5;
            padding:15px;
            border-radius:10px;
            width:120px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🌤 Weather Forecast</h1>
    <h3>Banjar, Indonesia</h3>

    <div class="forecast">
        <div class="card">
            <h3>Mon</h3>
            <p>☀️</p>
            <p>31°C</p>
        </div>

        <div class="card">
            <h3>Tue</h3>
            <p>⛅</p>
            <p>29°C</p>
        </div>

        <div class="card">
            <h3>Wed</h3>
            <p>🌧️</p>
            <p>25°C</p>
        </div>

        <div class="card">
            <h3>Thu</h3>
            <p>🌦️</p>
            <p>27°C</p>
        </div>

        <div class="card">
            <h3>Fri</h3>
            <p>☀️</p>
            <p>32°C</p>
        </div>
    </div>
</div>

</body>
</html>
